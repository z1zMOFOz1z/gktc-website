<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GateKeeperTC Card Enrollment{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <div class="brand">GateKeeperTC</div>
    <div class="brand-sub">Card enrollment</div>
  </div>
</header>
<main class="wrap">
  <div class="card">
    {% block content %}{% endblock %}
  </div>
  <footer class="foot">Cards enrolled here are picked up by the GateKeeperTC device automatically.</footer>
</main>
</body>
</html>
